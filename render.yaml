# Render Blueprint: creates the web service and its permanent disk in one step.
services:
  - type: web
    name: gateway-restaurant
    runtime: node
    plan: starter            # a permanent disk needs a paid plan
    buildCommand: echo "nothing to build"
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_KEY       # Render asks you to type this secret when you create the Blueprint
        sync: false
    disk:
      name: gateway-data
      mountPath: /var/data
      sizeGB: 1
