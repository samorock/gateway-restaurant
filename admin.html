<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gateway Admin</title>
<style>
:root{--bg:#F6F4F1;--surface:#fff;--ink:#1B1A18;--muted:#6A655E;--line:#E4DFD8;--orange:#EE6C1F;--green:#0E5A4B;--bad:#B42318}
@media (prefers-color-scheme:dark){:root{--bg:#141210;--surface:#1E1B18;--ink:#F3EFEA;--muted:#A8A097;--line:#35302B;--orange:#F27B35;--green:#3FB89B;--bad:#F2877D;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;padding:16px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:14px}
h1{margin:6px 0;font-size:26px}h2{margin:0 0 8px;font-size:19px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
input{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
button{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;background:var(--orange);color:#fff;cursor:pointer}
button.g{background:var(--green);color:#fff}button.x{background:transparent;color:var(--bad);border:1.5px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0}
.row:last-child{border:0}.muted{color:var(--muted);font-size:14px}.err{color:var(--bad);min-height:1.2em}.ok{color:var(--green);min-height:1.2em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.two{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>Gateway admin</h1>
<div class="card" id="keybox"><label for="key">Admin key</label><input id="key" type="password" autocomplete="off" placeholder="The ADMIN_KEY you set on the server"><p class="err" id="kerr"></p><button id="enter">Open admin</button></div>
<div id="main" hidden class="wrap" style="padding:0">
 <div class="card"><h2>Restaurants</h2><div id="list"></div></div>
 <div class="card"><h2>Add a restaurant</h2>
  <label for="n">Restaurant name</label><input id="n">
  <div class="two"><div><label for="a">Area (e.g. Kuto)</label><input id="a"></div><div><label for="t">Delivery time (e.g. 25-35)</label><input id="t" placeholder="25-35"></div></div>
  <label for="g">Food types, separated by commas</label><input id="g" placeholder="Nigerian Food, Rice">
  <div class="two"><div><label for="bn">Bank name</label><input id="bn"></div><div><label for="an">Account name</label><input id="an"></div></div>
  <label for="ac">Account number</label><input id="ac" inputmode="numeric">
  <label for="pw">Login password for the restaurant (at least 6 characters)</label><input id="pw" type="text" autocomplete="off">
  <p class="err" id="aerr"></p><button class="g" id="add">Add restaurant</button></div>
 <div class="card"><h2>Delivery fees</h2><p class="muted" style="margin-top:0">One area per line, like <b>Kuto = 500</b>.</p>
  <label for="zones">Areas and delivery fees (₦)</label><textarea id="zones" rows="8" style="width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px;font:inherit"></textarea>
  <div class="two"><div><label for="pk">Disposable pack per item (₦)</label><input id="pk" inputmode="numeric"></div><div><label for="sv">Service fee per order (₦)</label><input id="sv" inputmode="numeric"></div></div>
  <p class="err" id="cerr"></p><button class="g" id="savecfg">Save fees</button></div>
</div></div>
<script>
const $=s=>document.querySelector(s);let key="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(p,method="GET",body){const r=await fetch(p,{method,headers:{"Content-Type":"application/json","x-admin-key":key},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Something went wrong.");return j}
async function refresh(){
  const list=await api("/api/admin/restaurants");
  $("#list").innerHTML=list.length?list.map(r=>`<div class="row"><div><b>${esc(r.name)}</b><br><span class="muted">id: ${esc(r.id)} · ${esc(r.area)} · ${r.orders} order(s)</span></div><div><button class="g" data-pw="${esc(r.id)}">New password</button> <button class="x" data-del="${esc(r.id)}">Delete</button></div></div>`).join(""):`<p class="muted">No restaurants yet. Add the first one below.</p>`;
  const c=await api("/api/admin/config");
  $("#zones").value=Object.entries(c.zones).map(([k,v])=>k+" = "+v).join("\n");$("#pk").value=c.packPerItem;$("#sv").value=c.service;
}
$("#enter").onclick=async()=>{key=$("#key").value;try{await api("/api/admin/restaurants");$("#keybox").hidden=true;$("#main").hidden=false;refresh()}catch(e){$("#kerr").textContent=e.message}};
$("#add").onclick=async()=>{
  $("#aerr").textContent="";
  try{await api("/api/admin/restaurants","POST",{name:$("#n").value,area:$("#a").value,time:$("#t").value,tags:$("#g").value,bankName:$("#bn").value,acctName:$("#an").value,acctNo:$("#ac").value,password:$("#pw").value});
    ["n","a","t","g","bn","an","ac","pw"].forEach(i=>$("#"+i).value="");refresh()}catch(e){$("#aerr").textContent=e.message}};
$("#list").onclick=async e=>{
  const pw=e.target.dataset.pw,del=e.target.dataset.del;
  if(pw){const np=Math.random().toString(36).slice(2,10);try{await api("/api/admin/restaurants/"+pw,"PUT",{password:np});e.target.textContent="New password: "+np}catch(er){alert(er.message)}}
  if(del){if(e.target.dataset.sure!=="1"){e.target.dataset.sure="1";e.target.textContent="Tap again to delete";return}try{await api("/api/admin/restaurants/"+del,"DELETE");refresh()}catch(er){alert(er.message)}}
};
$("#savecfg").onclick=async()=>{
  $("#cerr").textContent="";const zones={};
  for(const line of $("#zones").value.split("\n")){const t=line.trim();if(!t)continue;const m=t.split("=");if(m.length!==2){$("#cerr").textContent='Write each area like "Kuto = 500".';return}zones[m[0].trim()]=parseInt(m[1].replace(/\D/g,""),10)}
  try{await api("/api/admin/config","PUT",{zones,packPerItem:$("#pk").value,service:$("#sv").value});$("#cerr").textContent="";$("#cerr").className="ok";$("#cerr").textContent="Saved.";setTimeout(()=>{$("#cerr").className="err";$("#cerr").textContent=""},2000)}catch(e){$("#cerr").textContent=e.message}};
</script></body></html>
